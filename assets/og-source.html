<!doctype html>
<!-- Source for assets/og.png (1200×630). Re-render with headless Chrome:
     chrome --headless=new --window-size=1200,630 --force-device-scale-factor=1 --screenshot=assets/og.png assets/og-source.html -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#FAFAFC;font-family:Inter,system-ui,sans-serif;color:#0E1116}
  canvas{position:absolute;inset:0}
  .wrap{position:absolute;inset:0;padding:64px 72px;display:flex;flex-direction:column}
  .logo{display:flex;align-items:center;gap:14px}
  .logo b{display:block;font-size:26px;font-weight:600;letter-spacing:-.01em;line-height:1.1}
  .logo small{display:block;font-family:'JetBrains Mono',monospace;font-size:15px;color:#555B6B}
  h1{margin:54px 0 0;font-size:72px;font-weight:600;letter-spacing:-.04em;line-height:1.02}
  h1 em{font-style:normal;color:#1F55F0}
  p{margin:24px 0 0;font-size:25px;color:#555B6B;max-width:640px;line-height:1.4}
  .chips{position:absolute;left:72px;bottom:58px;display:flex;gap:10px}
  .chips span{font-family:'JetBrains Mono',monospace;font-size:16px;color:#1747D6;background:#EAF0FF;border:1px solid #AFC3FF;border-radius:999px;padding:7px 14px}
  .card{position:absolute;right:56px;top:318px;width:340px;background:#fff;border:1px solid #E4E6EC;border-radius:16px;box-shadow:0 1px 2px rgba(14,17,22,.04),0 18px 40px rgba(14,17,22,.08);padding:18px}
  .card-top{display:flex;align-items:center;justify-content:space-between}
  .card-top b{font-size:20px;font-weight:600}
  .chip{display:inline-flex;align-items:center;gap:7px;font-family:'JetBrains Mono',monospace;font-size:14px;color:#15803D;background:#EFFBF3;border:1px solid #A6E3BC;border-radius:999px;padding:4px 11px}
  .chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
  .plot{position:relative;height:150px;margin-top:14px;border:1px solid #E4E6EC;border-radius:8px;background:#F4F5F8;overflow:hidden}
  .plot canvas{position:absolute;inset:0;width:100%;height:100%}
  .legend{display:flex;gap:16px;margin-top:14px;font-family:'JetBrains Mono',monospace;font-size:13px;color:#555B6B}
  .legend i{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px}
</style>
</head>
<body>
<canvas id="sky" width="1200" height="630"></canvas>
<div class="wrap">
  <div class="logo">
    <svg width="46" height="32" viewBox="0 0 19 13" shape-rendering="crispEdges"><g fill="#1F55F0"><rect x="7" y="0" width="5" height="1"/><rect x="5" y="1" width="9" height="1"/><rect x="2" y="2" width="15" height="1"/><rect x="1" y="3" width="17" height="4"/><rect x="0" y="5" width="19" height="2"/></g><g fill="#C9D7FF"><rect x="1" y="8" width="17" height="1"/></g><g fill="#1F55F0" opacity=".55"><rect x="3" y="10" width="2" height="2"/><rect x="9" y="10" width="2" height="2"/><rect x="14" y="10" width="2" height="2"/></g></svg>
    <span><b>Autopilot</b><small>Automated liquidity for Aerodrome</small></span>
  </div>
  <h1>Aerodrome Liquidity.<br>On <em>Autopilot.</em></h1>
  <p>One click. Auto-rebalancing keeps working to hold your range. Fees compound, AERO rewards stay yours.</p>
</div>
<div class="chips"><span>Non-custodial</span><span>Withdraw anytime</span><span>Rewards stay yours</span></div>
<div class="card">
  <div class="card-top"><b>WETH / USDC</b><span class="chip">In range</span></div>
  <div class="plot"><canvas id="plot" width="604" height="296"></canvas></div>
  <div class="legend"><span><i style="background:#1F55F0"></i>In range</span><span><i style="background:#C8102E"></i>Out of range</span><span><i style="background:#80869A"></i>Range</span></div>
</div>
<script>
// Deterministic pseudo-random so the image is reproducible.
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const sky = document.getElementById('sky').getContext('2d');
sky.fillStyle = '#DADDE6';
for (let i = 0; i < 70; i++) sky.fillRect(Math.round(rnd() * 1200), Math.round(rnd() * 630), 2, 2);
function cloud(ox, oy, w, h, strong) {
  const cell = 7, m = [], bumps = [[0.28, 0.6, 0.42], [0.52, 0.42, 0.58], [0.76, 0.62, 0.4]];
  for (let j = 0; j < h; j++) { m[j] = []; for (let i = 0; i < w; i++) {
    let inside = j >= h * 0.62 && i >= w * 0.06 && i <= w * 0.94;
    for (const [bx, by, br] of bumps) if (((i - bx * w) / (br * h * 1.25)) ** 2 + ((j - by * h) / (br * h)) ** 2 <= 1) inside = true;
    m[j][i] = inside; } }
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
    if (!m[j][i]) continue;
    const edge = j === 0 || i === 0 || j === h - 1 || i === w - 1 || !m[j - 1][i] || !(m[j + 1] && m[j + 1][i]) || !m[j][i - 1] || !m[j][i + 1];
    sky.globalAlpha = edge ? (strong ? 0.85 : 0.7) : 0.45;
    sky.fillStyle = edge && j !== h - 1 ? (strong ? '#1F55F0' : '#AFC3FF') : (strong ? '#1F55F0' : '#AFC3FF');
    if (edge) sky.fillRect(ox + i * cell, oy + j * cell, cell - 1, cell - 1);
    else if ((i + j) % 2 === 0) sky.fillRect(ox + i * cell + 2, oy + j * cell + 2, 2, 2);
  }
  sky.globalAlpha = 1;
}
cloud(700, 22, 20, 7, false);
cloud(-40, 470, 26, 9, false);
cloud(990, 70, 24, 8, true);
cloud(560, 470, 16, 7, false);

const pc = document.getElementById('plot').getContext('2d'); pc.scale(2, 2);
const cell = 10, cols = 30, rows = 15;
pc.fillStyle = '#DADDE6';
for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++) pc.fillRect(i * cell + 5, j * cell + 5, 1.5, 1.5);
let v = 3, lo = 2, hi = 6;
const Y = (r) => (rows - 1 - r) * cell;
for (let i = 0; i < cols; i++) {
  const prev = v;
  if (i < 8) v += rnd() < 0.55 ? 1 : 0; else v += [-1, 0, 0, 1][Math.floor(rnd() * 4)];
  v = Math.max(2, Math.min(rows - 3, v));
  let out = v > hi || v < lo;
  if (i === 15) { v = hi + 2; out = true; }
  if (i % 2 === 0) { pc.fillStyle = '#80869A'; pc.fillRect(i * cell + 1, Y(hi + 1) + 1, cell - 3, cell - 3); pc.fillRect(i * cell + 1, Y(lo - 1) + 1, cell - 3, cell - 3); }
  pc.fillStyle = out ? '#C8102E' : '#1F55F0';
  for (let r = Math.min(prev, v); r <= Math.max(prev, v); r++) pc.fillRect(i * cell, Y(r), cell - 2, cell - 2);
  if (out) { lo = v - 3; hi = v + 3; }
}
</script>
</body>
</html>
